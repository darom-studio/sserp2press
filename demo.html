<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="SSERP2PRESS · אהבת ציון, מהדורה ראשונה 1853: הסריקה מול הטקסט המשוחזר.">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>אהבת ציון 1853</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300&family=IBM+Plex+Sans+Hebrew:wght@300;400;500&family=Frank+Ruhl+Libre:wght@400;700;900&family=PT+Serif:wght@400;700&display=swap">
<style>
/* Layout: one quiet column; the old page is the only strong object on screen. */
:root{
  --bg:#F7F6F2; --fg:#1E1D1A; --muted:#6F6B63; --line:#DCD9D1; --field:#FFFFFF;
  --accent:#C2412E; --mark:#F3DB8A;
  --paper:#FBF8F0; --ink:#1A1916;
  --ui:'IBM Plex Sans Hebrew',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --book:'Frank Ruhl Libre','Noto Serif Hebrew','Times New Roman',serif;
  --cyr:'PT Serif','Times New Roman',serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#191917; --fg:#E9E6DF; --muted:#A39E94; --line:#34322E; --field:#232220; --accent:#E2735F; --mark:#8A6F1E; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#191917; --fg:#E9E6DF; --muted:#A39E94; --line:#34322E; --field:#232220; --accent:#E2735F; --mark:#8A6F1E; color-scheme:dark}

body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-weight:300;font-size:15px;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px;display:flex;flex-direction:column;gap:22px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px 16px;border-bottom:1px solid var(--line);padding-bottom:14px}
.logo{font-family:var(--mono);font-weight:300;font-size:15px;letter-spacing:.02em;direction:ltr}
.logo .a{color:var(--muted)} .logo .b{color:var(--accent)}
.tag{font-size:13px;color:var(--muted)}
h1{font-size:17px;font-weight:400;margin:0;text-wrap:balance}
.sub{margin:2px 0 0;font-size:13px;color:var(--muted)}

.bar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--field)}
.seg button{font:inherit;font-size:13px;font-weight:400;color:var(--muted);background:none;border:0;border-radius:999px;padding:6px 14px;min-height:34px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.seg .m{font-family:var(--mono);font-size:12px;letter-spacing:.04em}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tools{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.search{font:inherit;font-size:13px;color:var(--fg);background:var(--field);border:1px solid var(--line);border-radius:999px;padding:6px 14px;min-height:34px;width:200px;max-width:100%;box-sizing:border-box}
.count{font-size:12px;color:var(--muted)}

.stage{display:flex;flex-direction:column;align-items:center;gap:10px}
.stage[hidden]{display:none}
.page{cursor:ew-resize;touch-action:pan-y}
.page{position:relative;width:min(100%,520px);max-width:100%;container-type:inline-size;box-shadow:0 1px 2px rgba(0,0,0,.08),0 8px 28px rgba(0,0,0,.08);background:var(--paper);overflow:hidden}
.page img{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
.rest{position:absolute;inset:0;background:var(--paper);color:var(--ink);font-family:var(--book);clip-path:inset(0 0 0 var(--cut,50%))}
.handle{position:absolute;top:0;bottom:0;left:var(--cut,50%);width:0;border-left:1px solid rgba(0,0,0,.35);pointer-events:none}
.ln{position:absolute;white-space:nowrap;line-height:1}
.ln > span{display:inline-block;white-space:nowrap}
.ln.r,.ln.j{text-align:right} .ln.c{text-align:center}
.ln.ltr{direction:ltr;text-align:left;font-family:var(--cyr)} .ln.ltr.c{text-align:center}
.rule{position:absolute;border-top:1px solid var(--ink)}
.rule.thick{border-top:3px solid var(--ink);height:2px;border-bottom:1px solid var(--ink)}
mark{background:var(--mark);color:inherit;border-radius:2px}
.range{width:min(100%,520px);display:flex;align-items:center;gap:10px}
.range input{flex:1;accent-color:var(--fg);min-height:28px}
.range .m{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--muted)}

.phone{width:min(100%,360px);border:1px solid var(--line);border-radius:28px;padding:14px;background:var(--field);box-sizing:border-box}
.screen{background:var(--paper);color:var(--ink);border-radius:16px;padding:22px 20px;height:560px;overflow-y:auto;font-family:var(--book);font-size:18px;line-height:1.75;box-sizing:border-box}
.screen .au{font-size:14px;font-family:var(--ui);color:#6F6B63;margin:0;text-align:center}
.screen h3{font-size:24px;font-weight:700;margin:0 0 6px;text-align:center}
.screen .ch{font-size:20px;font-weight:700;text-align:center;margin:12px 0}
.screen p{margin:0 0 1em;text-align:justify}

.dec{border-top:1px solid var(--line)}
.dec h2{font-size:13px;font-weight:500;margin:14px 0 6px}
table{width:100%;border-collapse:collapse;font-size:13px}
td{padding:8px 0;border-bottom:1px solid var(--line);vertical-align:top}
td:last-child{color:var(--muted);text-align:left;padding-inline-start:12px}
footer{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding-top:12px}
footer .addr{font-family:var(--mono);direction:ltr;user-select:all}
</style>
</head>
<body>

<div class="wrap" dir="rtl" lang="he">
  <header>
    <span class="logo" aria-label="SSERP2PRESS"><span class="a">SSERP</span><span class="b">2</span>PRESS</span>
    <span class="tag">הדגמה</span>
  </header>

  <div>
    <h1>אהבת ציון · אברהם מאפו</h1>
    <p class="sub">מהדורה ראשונה, וילנה תרי״ג (1853)</p>
  </div>

  <div class="bar">
    <div class="seg" role="group" aria-label="תצוגה">
      <button type="button" id="v-press" aria-pressed="true"><span class="m">PRESS</span> · עמוד</button>
      <button type="button" id="v-web" aria-pressed="false"><span class="m">WEB</span> · ספר דיגיטלי</button>
    </div>
    <div class="seg" role="group" aria-label="עמוד" id="pages">
      <button type="button" id="pg-cover" aria-pressed="false">עטיפה</button>
      <button type="button" id="pg-p1" aria-pressed="true">עמוד 1</button>
    </div>
  </div>

  <div class="tools">
    <input class="search" id="q" type="search" placeholder="חיפוש בטקסט" aria-label="חיפוש בטקסט">
    <span class="count" id="count" aria-live="polite"></span>
  </div>

  <section class="stage" id="press">
    <div class="page" id="page">
      <img id="scan" alt="העמוד המקורי, סריקה">
      <div class="rest" id="rest" lang="he" dir="rtl"></div>
      <div class="handle" aria-hidden="true"></div>
    </div>
    <div class="range" dir="ltr">
      <span class="m">SSERP</span>
      <input type="range" id="cut" min="0" max="100" value="50" dir="ltr" aria-label="מקור מול משוחזר">
      <span class="m">PRESS</span>
    </div>
  </section>

  <section class="stage" id="web" hidden>
    <div class="phone"><div class="screen" id="screen" lang="he" dir="rtl"></div></div>
  </section>

  <section class="dec">
    <h2>החלטות</h2>
    <table>
      <tr><td>כתמי מים ולכלוך</td><td>הוסרו</td></tr>
      <tr><td>חותמות וסימני ספרייה</td><td>לא נכללו</td></tr>
      <tr><td>כתיב, ניקוד ופיסוק</td><td>כמו במקור</td></tr>
    </table>
  </section>

  <footer>
    <span>סריקה: הספרייה הלאומית · סטודיו דרום</span>
    <span class="addr">contact@sserp2press.com</span>
  </footer>
</div>

<script>
const P1 = [
"[[איש]] היה בירושלים בימי אָחָז מלך יהודה ושמו יוֹרָם",
"בן אֲבִיעֶזֶר , אלוף ביהודה ושר אלף , ויהי לו שדות וכרמים",
"בכרמל ובשרון ועדרי צאן ובקר בבית לחם יהודה , ויהי לו",
"כסף וזהב , היכלי שן וכל שכיות החמדה , ושתי נשים היו לו",
"שם האחת חַגִּית בת עִירָא , ושם השנית נַעֲמָה , ויאהב יורם",
"את נעמה מאד כי יפת תאר היא , ותקנא בה חגית צרתה",
"ותכעיסנה , כי לחגית היו שני בנים ולנעמה לא היה ולד , אך",
"נעמה היתה נעימה בתארה ובמעלליה, ויעש לה יורם בית לבד",
"למען לא תצור אותה חגית צרתה , וְעָכָן היה בן משק בית",
"יורם , ויתן יורם לו את הֶלְאָה שפחת חגית הכנענית לאשה ,",
"ואוהב דבק מאח היה ליורם ושמו יְדִידְיָה הנדיב , מגזע מלכי",
"יהודה , ושר הרכוש אשר למלך איש חמודות רך בשנים ,",
"עשיר ומגן לבני הנביאים למודי ה׳ , כי אהב נועם לקחם ויט",
"למשל אזנו , ויתמכם בנדיבת ידו , על כן קראו שמו ידידיה",
"הנדיב;ויתנוססו יורם וידידיה כאבני נזר בדור תהפוכות דור אחז,",
"כי נאמנה רוח שניהם עם אל ועם קדושיו, ויתהלכו בין למודי",
"ה׳ אשר תעודת בן אמוץ צרורה אתם ותורת ה׳ חתומה בם ."
];
const P2 = [
"וּמַתָּן השופט בן יוֹזָבָד העריץ התחבר ליורם ויהי איש",
"עצתו , ויתמם עם יורם באהבה מגולה ועברתו שמר בלבו, מיום",
"קחת יורם את חגית אהובתו לאשה , וזה הדבר אשר לא נשמר",
"יורם ממנו ויחשבהו לאוהב לו : כי יוזבד העריץ אבי מתן היה"
];

// item: [text, top%, left%, right%, font-size cqw, mode, weight, ltr]
// mode: j justify, r right, c center, s spread letters
const PAGES = {
  p1:{img:'page1853.jpg', ratio:'2448 / 3920', items:[
    ['א',26.6,46,39,5.2,'c',900],
    ...P1.map((t,i)=>[t,30.69+i*2.85,15.3,6.2,4.1,i===16?'r':'j',400]),
    ...P2.map((t,i)=>[t,80.13+i*2.64,15.3,i===0?9.8:6.2,4.1,'j',400]),
    ['איש',91.28,24.5,70.6,3.8,'r',700],
    ['1',91.28,54,43,3.0,'c',700]
  ]},
  cover:{img:'cover1853.jpg', ratio:'1358 / 1989', items:[
    ['אהבת ציון',10.0,23.6,21.9,11,'s',900],
    ['מאתי',23.0,43.4,44.8,2.8,'s',400],
    ['אברהם בן־יקותיאל מאפו',26.7,23.6,23.4,5.4,'j',700],
    ['איש קאוונא',33.6,38.3,37,3.0,'s',400],
    ['__rule',45.6,40.9,40.4],
    ['ווילנא',54.3,37.9,37.4,6.0,'s',900],
    ['בדפוס ר׳ יוסף ראובן בר׳ מנחם מן ר א ם',60.7,24.3,24.2,3.0,'j',400],
    ['__rule',65.0,49.3,47.4],
    ['שנת תרי״ג לפ״ק',66.5,32,31.9,3.0,'j',400],
    ['__thick',70.2,12.5,15.3],
    ['АГАВОТЪ ЦІОНЪ',72.9,35.7,36.7,3.0,'j',700,1],
    ['т. е.',75.5,44.9,49.6,2.0,'c',700,1],
    ['Любовь Ціона, Соч. Авраама Мапу.',77.0,25.4,26.4,3.0,'j',700,1],
    ['__rule',81.0,45.7,46.6],
    ['ВИЛЬНО,',82.4,42.7,44,3.0,'j',700,1],
    ['Въ Типографіи. Р. М. Ромма.',84.9,28,28.6,2.8,'j',700,1],
    ['__rule',86.9,47.5,48.3],
    ['1853.',89.0,46,47,3.0,'c',700,1]
  ]}
};

const MARKS = /[֑-ׇֽֿׁׂׅׄ]/g;
const isMark = ch => /[֑-ׇֽֿׁׂׅׄ]/.test(ch);
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const toHTML = t => esc(t).replace(/\[\[(.+?)\]\]/g,'<b>$1</b>');
let state = {page:'p1', view:'press', q:''};
try{ const s=JSON.parse(localStorage.getItem('az1853')||'{}'); if(s.page&&PAGES[s.page]) state.page=s.page; if(s.view) state.view=s.view; }catch(e){}
function save(){ try{ localStorage.setItem('az1853',JSON.stringify({page:state.page,view:state.view})); }catch(e){} }

function textNodes(root){ const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT); const a=[]; let n; while(n=w.nextNode()) a.push(n); return a; }
function applySearch(root){
  const q=state.q.replace(MARKS,'').trim(); if(!q) return 0; let total=0;
  textNodes(root).forEach(n=>{
    const s=n.nodeValue; let base='', map=[];
    for(let i=0;i<s.length;i++){ if(!isMark(s[i])){ map.push(i); base+=s[i]; } }
    const hits=[]; let k=base.indexOf(q); while(k>-1){ hits.push(k); k=base.indexOf(q,k+q.length); }
    if(!hits.length) return; total+=hits.length;
    const frag=document.createDocumentFragment(); let pos=0;
    hits.forEach(h=>{ const a=map[h]; const b=(h+q.length<map.length)?map[h+q.length]:s.length;
      frag.append(s.slice(pos,a)); const m=document.createElement('mark'); m.textContent=s.slice(a,b); frag.append(m); pos=b; });
    frag.append(s.slice(pos)); n.replaceWith(frag);
  });
  return total;
}

const pageEl=document.getElementById('page'), rest=document.getElementById('rest'), scan=document.getElementById('scan');
function renderPage(){
  const P=PAGES[state.page]; scan.src=P.img; pageEl.style.aspectRatio=P.ratio; rest.innerHTML='';
  P.items.forEach(it=>{
    if(it[0]==='__rule'||it[0]==='__thick'){ const r=document.createElement('div'); r.className='rule'+(it[0]==='__thick'?' thick':''); r.style.top=it[1]+'%'; r.style.left=it[2]+'%'; r.style.right=it[3]+'%'; rest.append(r); return; }
    const [t,top,left,right,fs,mode,wt,ltr]=it;
    const d=document.createElement('div'); d.className='ln '+(mode==='c'?'c':mode==='r'?'r':'j')+(ltr?' ltr':''); d.dataset.mode=mode;
    if(ltr) d.dir='ltr';
    d.style.top=top+'%'; d.style.left=left+'%'; d.style.right=right+'%'; d.style.fontSize=fs+'cqw'; d.dataset.fs=fs; d.style.fontWeight=wt;
    const s=document.createElement('span'); s.innerHTML=toHTML(t); d.append(s); rest.append(d);
  });
  const n=applySearch(rest); fitAll(); return n;
}
function fitAll(){
  rest.querySelectorAll('.ln').forEach(d=>{
    const s=d.firstChild, mode=d.dataset.mode;
    d.style.fontSize=d.dataset.fs+'cqw'; s.style.wordSpacing='0px'; s.style.letterSpacing='0px';
    const box=d.clientWidth; let w=s.getBoundingClientRect().width; if(!box||!w) return;
    if(w>box){ d.style.fontSize=(parseFloat(d.dataset.fs)*box/w*0.995)+'cqw'; w=s.getBoundingClientRect().width; }
    const extra=box-w; if(extra<=0.5) return;
    const txt=s.textContent.replace(MARKS,'');
    if(mode==='j'){ const gaps=(txt.match(/ /g)||[]).length; if(gaps) s.style.wordSpacing=(extra/gaps)+'px'; }
    else if(mode==='s'){ const chars=[...txt].length; if(chars>1) s.style.letterSpacing=(extra/(chars-1))+'px'; }
  });
}
function renderWeb(){
  const sc=document.getElementById('screen');
  sc.innerHTML='<p class="au">אברהם מאפו</p><h3>אהבת ציון</h3><div class="ch">א</div><p>'+toHTML(P1.join(' '))+'</p><p>'+toHTML(P2.join(' '))+' …</p>';
  return applySearch(sc);
}

const cut=document.getElementById('cut');
const setCut=()=>pageEl.style.setProperty('--cut',cut.value+'%');
cut.addEventListener('input',setCut); setCut();
let drag=false;
function dragTo(e){ const r=pageEl.getBoundingClientRect(); const v=Math.max(0,Math.min(100,(e.clientX-r.left)/r.width*100)); cut.value=v; setCut(); }
pageEl.addEventListener('pointerdown',e=>{ drag=true; try{pageEl.setPointerCapture(e.pointerId);}catch(_){} dragTo(e); });
pageEl.addEventListener('pointermove',e=>{ if(drag) dragTo(e); });
pageEl.addEventListener('pointerup',()=>{ drag=false; });
pageEl.addEventListener('pointercancel',()=>{ drag=false; });
function refresh(){
  document.getElementById('press').hidden=state.view!=='press';
  document.getElementById('web').hidden=state.view!=='web';
  document.getElementById('v-press').setAttribute('aria-pressed',state.view==='press');
  document.getElementById('v-web').setAttribute('aria-pressed',state.view==='web');
  document.getElementById('pg-cover').setAttribute('aria-pressed',state.page==='cover');
  document.getElementById('pg-p1').setAttribute('aria-pressed',state.page==='p1');
  document.getElementById('pages').style.visibility=state.view==='press'?'visible':'hidden';
  const n=state.view==='press'?renderPage():renderWeb();
  document.getElementById('count').textContent=state.q.trim()?(n?n+' מופעים':'לא נמצא'):'';
}
document.getElementById('v-press').onclick=()=>{state.view='press';save();refresh();};
document.getElementById('v-web').onclick=()=>{state.view='web';save();refresh();};
document.getElementById('pg-cover').onclick=()=>{state.page='cover';save();refresh();};
document.getElementById('pg-p1').onclick=()=>{state.page='p1';save();refresh();};
document.getElementById('q').oninput=e=>{state.q=e.target.value;refresh();};
new ResizeObserver(()=>{ if(state.view==='press') fitAll(); }).observe(pageEl);
refresh();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ if(state.view==='press') fitAll(); });
</script>
</body>
</html>
